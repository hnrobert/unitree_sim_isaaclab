    items:
      - { type: box_g, at: [0.0, 0.15], yaw: 10 }
      - { type: book, at: [-0.2, -0.15], color: [0.9, 0.75, 0.2] }
      - { type: stapler_g, at: [0.18, -0.1], yaw: 40 }
  table_13:
    task: 水果角
    items:
      - { type: box_g, at: [0.0, 0.2], color: [0.55, 0.42, 0.3] }
      - { type: banana_g, at: [-0.14, -0.12], yaw: 15 }
      - { type: banana_g, at: [0.1, -0.18], yaw: -30 }
      - { type: apple, at: [0.16, 0.05] }
  table_14:
    task: 布草角
    items:
      - { type: towel, at: [-0.08, 0.05] }
      - { type: towel, at: [-0.08, 0.05], up: 0.028 }
      - { type: plate, at: [0.15, 0.15], color: [0.92, 0.92, 0.9] }
      - { type: plate, at: [0.15, -0.1], color: [0.6, 0.8, 0.95] }
  table_15:
    task: 图书角
    items:
      - { type: bookstand, at: [0.0, 0.3] }
      - { type: book, at: [0.0, 0.06], color: [0.85, 0.3, 0.25] }
      - { type: book, at: [0.0, 0.06], color: [0.25, 0.5, 0.85], up: 0.042 }
      - { type: mug_g, at: [0.18, -0.2] }
