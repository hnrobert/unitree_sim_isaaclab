robot_description_semantic: "<?xml version=\"1.0\"?>\n<!-- G1-D + Dex1 SRDF: two 7-DOF\
  \ arm planning groups.\n     Root chain AGV -> lift -> Pitching/Yaw -> torso is\
  \ treated as\n     the fixed \"base frame\" (their current joint values go into\
  \ the\n     start state; only the arm joints are planned). Dex1 fingers are\n  \
  \   NOT a MoveIt group - the bridge commands grippers directly. -->\n<robot name=\"\
  g1_d_with_dex1_1\">\n  <group name=\"right_arm\">\n    <chain base_link=\"torso_link\"\
  \ tip_link=\"right_dex1_base_link\"/>\n  </group>\n  <group name=\"left_arm\">\n\
  \    <chain base_link=\"torso_link\" tip_link=\"left_dex1_base_link\"/>\n  </group>\n\
  \n  <group_state name=\"home\" group=\"right_arm\">\n    <joint name=\"right_shoulder_pitch_joint\"\
  \ value=\"0.0\"/>\n    <joint name=\"right_shoulder_roll_joint\" value=\"0.0\"/>\n\
  \    <joint name=\"right_shoulder_yaw_joint\" value=\"0.0\"/>\n    <joint name=\"\
  right_elbow_joint\" value=\"0.3\"/>\n    <joint name=\"right_wrist_roll_joint\"\
  \ value=\"0.0\"/>\n    <joint name=\"right_wrist_pitch_joint\" value=\"0.0\"/>\n\
  \    <joint name=\"right_wrist_yaw_joint\" value=\"0.0\"/>\n  </group_state>\n \
  \ <group_state name=\"home\" group=\"left_arm\">\n    <joint name=\"left_shoulder_pitch_joint\"\
  \ value=\"0.0\"/>\n    <joint name=\"left_shoulder_roll_joint\" value=\"0.0\"/>\n\
  \    <joint name=\"left_shoulder_yaw_joint\" value=\"0.0\"/>\n    <joint name=\"\
  left_elbow_joint\" value=\"0.3\"/>\n    <joint name=\"left_wrist_roll_joint\" value=\"\
  0.0\"/>\n    <joint name=\"left_wrist_pitch_joint\" value=\"0.0\"/>\n    <joint\
  \ name=\"left_wrist_yaw_joint\" value=\"0.0\"/>\n  </group_state>\n\n  <!-- adjacent\
  \ + near-adjacent pairs; the torso clears both arms -->\n  <disable_collisions link1=\"\
  torso_link\" link2=\"right_shoulder_pitch_link\"/>\n  <disable_collisions link1=\"\
  torso_link\" link2=\"right_shoulder_roll_link\"/>\n  <disable_collisions link1=\"\
  torso_link\" link2=\"right_shoulder_yaw_link\"/>\n  <disable_collisions link1=\"\
  torso_link\" link2=\"right_elbow_link\"/>\n  <disable_collisions link1=\"torso_link\"\
  \ link2=\"right_wrist_roll_link\"/>\n  <disable_collisions link1=\"torso_link\"\
  \ link2=\"left_shoulder_pitch_link\"/>\n  <disable_collisions link1=\"torso_link\"\
